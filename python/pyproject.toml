[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "cnv-sc-rs"
description = "Copy number inference from single cell expression, in Rust. A port of the expression path of numbat."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gregor Lueg", email = "gregorlueg@me.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "polars>=1.0",
    "beartype>=0.19",
]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Documentation = "https://gregorlueg.github.io/cnv-sc-rs/"
Repository = "https://github.com/GregorLueg/cnv-sc-rs"

[project.optional-dependencies]
# `infer_cnv_adata(adata, ...)`.
anndata = ["anndata>=0.10"]

[dependency-groups]
dev = [
    "maturin>=1.15,<2.0",
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.1",
    "anndata>=0.10",
]
# mkdocstrings reads the installed package, so a docs build needs the compiled
# extension present: `maturin develop --release` before `mkdocs build`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "cnv_sc_rs._cnv_sc_rs"
python-source = "."
strip = true
include = ["cnv_sc_rs/py.typed", "cnv_sc_rs/*.pyi"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# `X` for the count matrix is the scanpy / scikit-learn convention.
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["cnv_sc_rs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
